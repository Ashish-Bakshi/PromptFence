services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Syncs your local code to the container so you don't have to rebuild on every change
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/promptfence
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: promptfence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d promptfence"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data: